version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kdp_studio_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./backups:/app/backups
    environment:
      - AMAZON_DEFAULT_MARKETPLACE=US
      - AI_PROVIDER=openai
      - OPENAI_BASE_URL=https://api.groq.com/openai/v1
      - OPENAI_MODEL=openai/gpt-oss-120b
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kdp_studio_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
